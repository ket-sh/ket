# bun run docs:glossary writes this file from docs/glossary.md.
extends: substitution
message: "One concept, one name: use '%s' instead of '%s'."
level: error
scope: text
ignorecase: true
swap:
  code base: codebase
  fail-over: failover
  pre commit: pre-commit
  round robin: round-robin
  sub-agent: subagent
  type-check: typecheck
  work-tree: worktree
