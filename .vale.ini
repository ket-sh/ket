StylesPath = .vale/styles
MinAlertLevel = error
Vocab = ket

Packages = https://github.com/errata-ai/Microsoft/releases/download/v0.14.2/Microsoft.zip

[*.md]
BasedOnStyles = Vale, Microsoft, ket
Vale.Spelling = NO
Microsoft.Accessibility = error
Microsoft.Acronyms = error
Microsoft.Adverbs = error
Microsoft.Ellipses = error
Microsoft.FirstPerson = error
Microsoft.GeneralURL = error
Microsoft.HeadingAcronyms = error
Microsoft.HeadingPunctuation = error
Microsoft.Headings = error
Microsoft.Hyphens = error
Microsoft.OxfordComma = error
Microsoft.Passive = error
Microsoft.Semicolon = error
Microsoft.SentenceLength = error
Microsoft.Suspended = error
Microsoft.Terms = error
Microsoft.URLFormat = error
Microsoft.We = error
Microsoft.Wordiness = error
Microsoft.Avoid = NO
Microsoft.HeadingColons = NO
Microsoft.Vocab = NO

# Agent prompts and slash commands are read by a model, not by a person browsing
# documentation. The Microsoft voice rules fight imperative instruction: it
# prefers "don't edit" where a prompt is clearer saying "do not edit". The house
# rules still apply, so no em dash gets in here either. Same reasoning already
# exempts .agents/** and .claude/skills/**.
[harness/**]
# An agent's name is an identifier, and the file it lives in is named after it,
# so term capitalization has nothing to say about it.
Vale.Terms = NO
Microsoft.Accessibility = NO
Microsoft.Acronyms = NO
Microsoft.Adverbs = NO
Microsoft.Contractions = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.HeadingAcronyms = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.Hyphens = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Suspended = NO
Microsoft.Terms = NO
Microsoft.We = NO
Microsoft.Wordiness = NO

