name: mutation-weekly

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation full (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/cli
          - packages/oxlint-plugin-ket
          - packages/preset
          - presets/cli
          - presets/web
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            ${{ matrix.package }}/reports/stryker-incremental.json
          key: mutation-${{ matrix.package }}-weekly-${{ github.sha }}
          restore-keys: |
            mutation-${{ matrix.package }}-
      - name: Retest everything and rewrite the baseline
        run: bunx turbo run test:mutation --filter=./${{ matrix.package }} -- --incremental --force
